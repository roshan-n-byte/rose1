services:
  - type: web
    name: ai-welfare-monitor
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-welfare-monitor
          property: host